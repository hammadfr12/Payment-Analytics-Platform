[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-growth-analytics"
version = "1.0.0"
description = "Payment Growth Analytics Platform — synthetic-data portfolio analytics product (SQL + Python + Tableau + FastAPI + Streamlit)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hammad Khan" }]
keywords = ["payments", "analytics", "success-rate", "rca", "benchmarking", "tableau", "duckdb"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "streamlit>=1.30",
    "plotly>=5.18",
    "tableauhyperapi>=0.0.18",
    "python-dotenv>=1.0",
    "faker>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.26",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/.venv/*"]
